<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics></helmet>
<div style="width:80px;flex:none;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0">
  <div style="width:44px;height:44px;border-radius:50%;background:#111318;display:flex;align-items:center;justify-content:center;flex:none;margin-bottom:6px">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.5" stroke="#F1F3F7" stroke-width="1.6"></circle><circle cx="9" cy="9" r="2.4" fill="#F1F3F7"></circle></svg>
  </div>
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
    <div title="{{ it.label }}" style="width:44px;height:44px;border-radius:50%;background:{{ it.bg }};border:1px solid {{ it.border }};display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer" dangerouslySetInnerHTML="{{ it.svg }}"></div>
  </sc-for>
  <div style="flex:1"></div>
  <div style="width:44px;height:44px;border-radius:50%;background:#FFFFFF;border:1px solid #E7EAF0;display:flex;align-items:center;justify-content:center;flex:none" dangerouslySetInnerHTML="{{ settingsSvg }}"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:80,&quot;height&quot;:600},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;transit&quot;,&quot;options&quot;:[&quot;transit&quot;,&quot;profiles&quot;,&quot;review&quot;,&quot;chain&quot;,&quot;measures&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active;
    const icons = {
      transit: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 9h13" stroke="COLOR" stroke-width="1.6" stroke-linecap="round"/><path d="M11 4l4.5 5-4.5 5" stroke="COLOR" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>',
      profiles: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="6.5" cy="8" r="3.4" stroke="COLOR" stroke-width="1.5"/><circle cx="11.5" cy="8" r="3.4" stroke="COLOR" stroke-width="1.5"/></svg>',
      review: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="COLOR" stroke-width="1.5"/><path d="M5.8 9.2l2.1 2.1 4.3-4.6" stroke="COLOR" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>',
      chain: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="5.5" width="8" height="7" rx="3.5" stroke="COLOR" stroke-width="1.5"/><rect x="8" y="5.5" width="8" height="7" rx="3.5" stroke="COLOR" stroke-width="1.5"/></svg>',
      measures: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="9" width="3" height="6" rx="1" fill="COLOR"/><rect x="7.5" y="5" width="3" height="10" rx="1" fill="COLOR"/><rect x="12" y="7.5" width="3" height="7.5" rx="1" fill="COLOR"/></svg>'
    };
    const order = ['transit','profiles','review','chain','measures'];
    const labels = {transit:'Transit',profiles:'Profiles',review:'Review',chain:'Chain',measures:'Measures'};
    const items = order.map(key => {
      const isActive = key === active;
      const color = isActive ? '#FFFFFF' : '#3F4552';
      return {
        label: labels[key],
        bg: isActive ? '#111318' : '#FFFFFF',
        border: isActive ? '#111318' : '#E7EAF0',
        svg: { __html: icons[key].split('COLOR').join(color) }
      };
    });
    const settingsSvg = { __html: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 6.5h12M3 9h12M3 11.5h8" stroke="#8A91A0" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="6.5" r="1.6" fill="#8A91A0"/><circle cx="13" cy="9" r="1.6" fill="#8A91A0"/><circle cx="6" cy="11.5" r="1.6" fill="#8A91A0"/></svg>' };
    return { items, settingsSvg };
  }
}
</script>
</body>
</html>
